name: CAREFA Base Set image acquisition (102 cards)
on:
  push:
    branches: [carefa-image-acquisition-pilot-20261023]
    paths: [.github/workflows/carefa-base-set-102.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download and validate 102 original Base Set card scans
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures, hashlib, json, pathlib, time, urllib.request
          root=pathlib.Path('carefa-base-set-102')
          root.mkdir(exist_ok=True)
          def fetch(number):
              url=f'https://assets.tcgdex.net/en/base/base1/{number}/high.webp'
              result={'language':'en','set_id':'base1','number':str(number),'source':'TCGdex','url':url,'status':'MISSING'}
              for attempt in range(3):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'CAREFA-Research-ImageArchive/1.0'})
                      with urllib.request.urlopen(req,timeout=25) as response:
                          data=response.read(4000001)
                      if not (1000 <= len(data) <= 4000000 and data[:4]==b'RIFF' and data[8:12]==b'WEBP'):
                          raise ValueError('Invalid WebP image or file size')
                      filename=f'base1_{number:03d}.webp'
                      (root/filename).write_bytes(data)
                      result.update(status='DOWNLOADED_UNREVIEWED',filename=filename,bytes=len(data),sha256=hashlib.sha256(data).hexdigest())
                      break
                  except Exception as e:
                      result['error']=str(e)[:250]
                      if attempt<2: time.sleep(1+attempt)
              return result
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              results=sorted(pool.map(fetch,range(1,103)),key=lambda x:int(x['number']))
          (root/'manifest.json').write_text(json.dumps({'scope':'English Base Set 1-102','results':results},indent=2))
          good=sum(x['status']=='DOWNLOADED_UNREVIEWED' for x in results)
          print(f'DOWNLOADED {good} / 102')
          for x in results:
              if x['status']!='DOWNLOADED_UNREVIEWED': print('FAILED',x['number'],x.get('error'))
          if good==0: raise SystemExit('No card images downloaded')
          PY
      - name: Save card images and provenance manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carefa-english-base-set-102
          path: carefa-base-set-102/
          retention-days: 7
          if-no-files-found: warn
